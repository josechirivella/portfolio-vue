name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    runs-on: 'ubuntu-latest'

    steps:
      - name: Checkout 🛎
        uses: actions/checkout@main

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # Uses package.json#packageManager (pnpm@12.4.2)
          run_install: false

      - name: Setup node env 🏗
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          check-latest: true
          cache: 'pnpm'

      - name: Install dependencies 👨🏻‍💻
        run: pnpm install --frozen-lockfile

      - name: Run linter 👀
        run: pnpm lint

      - name: Run tests 🧪
        run: pnpm test
