packages:
  - '.'

# Former .npmrc settings (pnpm 11+ reads these from the workspace file)
autoInstallPeers: true
strictPeerDependencies: false
shamefullyHoist: true

# Approved dependency lifecycle scripts (replaces package.json#pnpm.onlyBuiltDependencies)
allowBuilds:
  '@parcel/watcher': true
  '@posthog/cli': true
  '@vercel/speed-insights': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
